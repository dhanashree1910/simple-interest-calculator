<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Interest Calculator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .calculator-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 420px;
            width: 100%;
        }
        h2 {
            color: #333;
            margin-bottom: 8px;
            text-align: center;
        }
        p.subtitle {
            color: #666;
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #444;
            font-weight: 600;
            font-size: 0.9rem;
        }
        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #007bff;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result-box {
            margin-top: 24px;
            padding: 15px;
            background-color: #eef6ff;
            border-left: 4px solid #007bff;
            border-radius: 4px;
            display: none;
        }
        .result-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.95rem;
            color: #333;
        }
        .result-item:last-child {
            margin-bottom: 0;
            font-weight: bold;
            font-size: 1.05rem;
            color: #007bff;
        }
        footer {
            margin-top: 20px;
            text-align: center;
            font-size: 0.8rem;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="calculator-card">
        <h2>Simple Interest Calculator</h2>
        <p class="subtitle">SI = (P × R × T) / 100</p>
        <form id="si-form">
            <div class="form-group">
                <label for="principal">Principal Amount (P)</label>
                <input type="number" id="principal" placeholder="e.g. 1000" step="any" required>
            </div>
            <div class="form-group">
                <label for="rate">Rate of Interest per Year % (R)</label>
                <input type="number" id="rate" placeholder="e.g. 5" step="any" required>
            </div>
            <div class="form-group">
                <label for="time">Time in Years (T)</label>
                <input type="number" id="time" placeholder="e.g. 2" step="any" required>
            </div>
            <button type="submit">Calculate</button>
        </form>

        <div class="result-box" id="result-box">
            <div class="result-item">
                <span>Simple Interest (SI):</span>
                <span id="si-value">$0.00</span>
            </div>
            <div class="result-item">
                <span>Total Amount (P + SI):</span>
                <span id="total-value">$0.00</span>
            </div>
        </div>

        <footer>Created by Dhanashree Jagtap</footer>
    </div>

    <script>
        document.getElementById('si-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const p = parseFloat(document.getElementById('principal').value);
            const r = parseFloat(document.getElementById('rate').value);
            const t = parseFloat(document.getElementById('time').value);

            if (!isNaN(p) && !isNaN(r) && !isNaN(t)) {
                const interest = (p * r * t) / 100;
                const total = p + interest;

                document.getElementById('si-value').innerText = '$' + interest.toFixed(2);
                document.getElementById('total-value').innerText = '$' + total.toFixed(2);
                document.getElementById('result-box').style.display = 'block';
            }
        });
    </script>
</body>
</html>
